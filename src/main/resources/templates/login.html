<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio de sesión | CSMT</title>
    <style>
        :root {
            color-scheme: light;
            --primary: #123f68;
            --primary-dark: #0b2b49;
            --background: #f2f5f8;
            --text: #1f2933;
            --muted: #66788a;
            --border: #d5dde5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background: var(--background);
            color: var(--text);
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(18, 63, 104, 0.14);
            max-width: 420px;
            padding: 40px;
            width: 100%;
        }

        .brand {
            color: var(--primary);
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0 0 8px;
            text-align: center;
        }

        .subtitle {
            color: var(--muted);
            margin: 0 0 32px;
            text-align: center;
        }

        .field {
            display: block;
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .field input {
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            padding: 12px;
            width: 100%;
        }

        .field input:focus {
            border-color: var(--primary);
            outline: 2px solid rgba(18, 63, 104, 0.18);
        }

        .submit-button {
            background: var(--primary);
            border: 0;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            margin-top: 8px;
            padding: 13px;
            width: 100%;
        }

        .submit-button:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>
<main class="login-card">
    <h1 class="brand">CSMT</h1>
    <p class="subtitle">Acceso para operarios</p>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <p th:if="${param.error}">Usuario o contraseña incorrectos.</p>
        <p th:if="${param.logout}">Has cerrado la sesión correctamente.</p>

        <div class="field">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text"
                   autocomplete="username" placeholder="Introduce tu usuario" required>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" placeholder="Introduce tu contraseña" required>
        </div>

        <button class="submit-button" type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
